<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>World Clock</title>
		<link rel="stylesheet" href="src/style.css" />
		<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
	</head>
	<body>
		<main id="main-column">
			<h1>World Clock</h1>
			<select id="cities-selector">
				<option value>Select a city</option>
				<option value="Europe/Amsterdam">Amsterdam</option>
				<option value="Europe/Budapest">Budapest</option>
				<option value="Africa/Casablanca">Casablanca</option>
				<option value="Asia/Damascus">Damascus</option>
				<option value="Pacific/Easter">Easter</option>
				<option value="Atlantic/Faroe">Faroe</option>
				<option value="Pacific/Galapagos">Galapagos</option>
				<option value="Australia/Hobart">Hobart</option>
				<option value="Asia/Istanbul">Istanbul</option>
				<option value="Africa/Johannesburg">Johannesburg</option>
				<option value="Pacific/Kiritimati">Kiritimati</option>
				<option value="Europe/London">London</option>
				<option value="America/Montreal">Montreal</option>
				<option value="Africa/Nairobi">Nairobi</option>
				<option value="Asia/Omsk">Asia/Omsk</option>
				<option value="Pacific/Pitcairn">Pitcairn</option>
				<option value="Australia/Queensland">Queensland</option>
				<option value="America/Rainy_River">Rainy River</option>
				<option value="America/Argentina/San_Juan">San Juan</option>
				<option value="Africa/Tripoli">Tripoli</option>
				<option value="Europe/Ulyanovsk">Europe/Ulyanovsk</option>
				<option value="Antarctica/Vostok">Vostok</option>
				<option value="Pacific/Wake">Pacific/Wake</option>
			</select>
			<div id="cities-container">
				<div class="city" id="new-york">
					<div class="cityanddate">
						<h2>New York</h2>
						<div class="date"></div>
					</div>

					<div class="time"></div>
				</div>
				<div class="city" id="dublin">
					<div class="cityanddate">
						<h2>Dublin</h2>
						<div class="date"></div>
					</div>

					<div class="time"></div>
				</div>
			</div>
		</main>
		<footer>
			This project was coded by
			<a href="https://github.com/clkaha">Claire H</a> and is open-sourced on
			<a href="https://github.com/clkaha/world-clock">GitHub</a>.
		</footer>
		<script src="src/script.js"></script>
	</body>
</html>
